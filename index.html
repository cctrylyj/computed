<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体积计算器</title>
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="体积计算器">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 30px; font-size: 28px; }
        .unit-toggle {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: #f0f0f0;
            border-radius: 25px;
            padding: 5px;
        }
        .unit-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #666;
        }
        .unit-btn.active { background: #667eea; color: white; }
        .input-group { margin-bottom: 20px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            outline: none;
        }
        .input-group input:focus { border-color: #667eea; }
        .result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-top: 30px;
        }
        .result-label { font-size: 14px; opacity: 0.9; margin-bottom: 10px; }
        .result-value { font-size: 36px; font-weight: 700; }
        .result-unit { font-size: 18px; opacity: 0.9; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 体积计算器</h1>
        <div class="unit-toggle">
            <button class="unit-btn active" data-unit="cm">厘米 (cm)</button>
            <button class="unit-btn" data-unit="m">米 (m)</button>
        </div>
        <div class="input-group">
            <label for="length">长度</label>
            <input type="number" id="length" placeholder="输入长度" step="0.01" min="0">
        </div>
        <div class="input-group">
            <label for="width">宽度</label>
            <input type="number" id="width" placeholder="输入宽度" step="0.01" min="0">
        </div>
        <div class="input-group">
            <label for="height">高度</label>
            <input type="number" id="height" placeholder="输入高度" step="0.01" min="0">
        </div>
        <div class="result" id="result" style="display: none;">
            <div class="result-label">体积</div>
            <div class="result-value" id="volume">0</div>
            <div class="result-unit" id="volume-unit">cm³</div>
        </div>
    </div>
    <script>
        let currentUnit = 'cm';
        const unitBtns = document.querySelectorAll('.unit-btn');
        unitBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                unitBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentUnit = btn.dataset.unit;
                calculateVolume();
            });
        });
        ['length', 'width', 'height'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateVolume);
        });
        function calculateVolume() {
            const length = parseFloat(document.getElementById('length').value);
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);
            const resultDiv = document.getElementById('result');
            if (isNaN(length) || isNaN(width) || isNaN(height) || length < 0 || width < 0 || height < 0) {
                resultDiv.style.display = 'none';
                return;
            }
            const volume = length * width * height;
            resultDiv.style.display = 'block';
            document.getElementById('volume').textContent = volume.toLocaleString('zh-CN', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            document.getElementById('volume-unit').textContent = currentUnit === 'cm' ? 'cm³' : 'm³';
        }
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
